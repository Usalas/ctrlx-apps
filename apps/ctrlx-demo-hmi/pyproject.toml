[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlx-demo-hmi"
version = "1.0.0"
description = "Drag-and-drop HMI builder for ctrlX OS 4.x with Data Layer tags"
requires-python = ">=3.10"
dependencies = ["ctrlx-datalayer<=3.6"]

[tool.setuptools]
packages = ["app"]
