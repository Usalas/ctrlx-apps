name: ctrlx-acme-hello
title: Acme Hello
version: 1.0.0
summary: Reads CPU load from the ctrlX Data Layer
description: |
  <!--
  author: Acme Inc.
  url: https://example.com
  -->
  Reads framework/metrics/system/cpu-utilisation-percent every 5 s and logs it.
base: core24
confinement: strict
grade: stable

platforms:
  amd64:
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  hello:
    command: bin/run.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    plugs:
      - network
      - datalayer

parts:
  hello:
    plugin: python
    source: .
    stage-packages:
      - ctrlx-datalayer
    # The datalayer deb ships headers, tools, static libs and BOTH arches' .so.
    # Keep only the runtime .so for the target arch (cuts the snap from ~35 MB to ~8 MB).
    override-prime: |
      craftctl default
      rm -rf usr/include usr/bin usr/lib/*/pkgconfig usr/lib/*/libcomm_datalayer_static.a
      find usr/lib -mindepth 1 -maxdepth 1 -type d ! -name "${CRAFT_ARCH_TRIPLET_BUILD_FOR}" -exec rm -rf {} +
      rm -rf lib/python3*/site-packages/pip lib/python3*/site-packages/setuptools
  wrapper:
    plugin: dump
    source: wrapper/
    organize:
      run.sh: bin/run.sh

plugs:
  datalayer:
    interface: content
    content: datalayer
    target: $SNAP_DATA/.datalayer

lint:
  ignore:
    - library:
        - usr/lib/aarch64-linux-gnu/libcomm_datalayer.so.*
        - usr/lib/x86_64-linux-gnu/libcomm_datalayer.so.*
