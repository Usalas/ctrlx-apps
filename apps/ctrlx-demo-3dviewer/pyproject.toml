[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlx-demo-3dviewer"
version = "1.0.5"
description = "3D STL assembly viewer driven by ctrlX MOTION axes and kinematics, for ctrlX OS 4.x"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9,<4", "ctrlx-datalayer<=3.6"]

[tool.setuptools]
packages = ["app"]
