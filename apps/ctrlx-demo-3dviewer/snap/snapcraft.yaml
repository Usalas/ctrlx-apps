name: ctrlx-demo-3dviewer
title: CtrlX 3D Viewer
version: 1.0.5
summary: Assemble STL models in 3D and drive them from ctrlX MOTION for ctrlX OS 4.x
description: |
  <!--
  author: Demo
  url: https://example.com
  -->
  Build for ctrlX OS 4.x (base core24, Data Layer 3.x from SDK 4.6.0).
  Upload STL files to the ctrlX CORE, assemble them in a browser 3D scene and attach
  each part to a motion axis (linear or rotary) or to a kinematics TCP to watch the
  machine move live. Kinematics TCP with path trail, teach points and safe/work areas
  from ctrlX MOTION are shown as overlays, with safe-area violations highlighted.
  Models and scene are stored in the active ctrlX configuration (Solutions).
  Read-only: the app never commands motion.
base: core24
confinement: strict
grade: stable

platforms:
  amd64:
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  web:
    command: bin/run.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    plugs:
      - network           # Data Layer IPC
      - network-bind      # REQUIRED for listen()/accept() on web.sock (seccomp)
      - datalayer
      - active-solution   # STL models and scene are saved in the active configuration
    slots:
      - package-assets    # package-manifest.json -> reverse proxy, sidebar, app directory
      - package-run       # web.sock for the reverse proxy

parts:
  web:
    plugin: python
    source: .
    stage-packages:
      - ctrlx-datalayer
    override-prime: |
      craftctl default
      rm -rf usr/include usr/bin usr/lib/*/pkgconfig usr/lib/*/libcomm_datalayer_static.a
      TRIPLET="${CRAFT_ARCH_TRIPLET_BUILD_FOR:-${CRAFT_ARCH_TRIPLET:-}}"
      if [ -n "$TRIPLET" ] && [ -d "usr/lib/$TRIPLET" ]; then
        find usr/lib -mindepth 1 -maxdepth 1 -type d ! -name "$TRIPLET" -exec rm -rf {} +
      fi
      rm -rf lib/python3*/site-packages/pip lib/python3*/site-packages/setuptools

  www:
    plugin: dump
    source: ./www
    organize:
      "*": www/

  configs:
    plugin: dump
    source: ./configs
    organize:
      "package-assets/*": package-assets/${CRAFT_PROJECT_NAME}/

  wrapper:
    plugin: dump
    source: wrapper/
    organize:
      run.sh: bin/run.sh

slots:
  package-assets:
    interface: content
    content: package-assets
    source:
      read:
        - $SNAP/package-assets/${CRAFT_PROJECT_NAME}
  package-run:
    interface: content
    content: package-run
    source:
      write:
        - $SNAP_DATA/package-run/${CRAFT_PROJECT_NAME}

plugs:
  datalayer:
    interface: content
    content: datalayer
    target: $SNAP_DATA/.datalayer
  active-solution:
    interface: content
    content: solutions
    target: $SNAP_COMMON/solutions

lint:
  ignore:
    - library:
        - usr/lib/aarch64-linux-gnu/libcomm_datalayer.so.*
        - usr/lib/x86_64-linux-gnu/libcomm_datalayer.so.*
